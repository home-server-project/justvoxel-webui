{{define "password.html"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JustVoxel - {{.Title}}</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="login-shell"><section class="panel login-panel"><p class="eyebrow">Administrator account</p><h1>Change password</h1><p class="muted">Use 12 to 128 characters. The new password replaces the current local WebUI administrator credential.</p>{{if .Error}}<div class="alert">{{.Error}}</div>{{end}}<form method="post" action="/password"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required autofocus></label><label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button type="submit">Change password</button></form><p class="foot">WebUI {{.Version}} · Management API {{.ManagementAPI}}</p></section></main></body></html>{{end}}
