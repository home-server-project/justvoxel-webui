name: A4.4.4 first-run review check

on:
  push:
    branches: [a443-webui-setup-plan-client-work]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: false
      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l internal/api/setup_plan.go internal/api/setup_plan_test.go internal/server/admin_discovery_page.go internal/server/setup_wizard.go internal/server/setup_wizard_storage.go internal/server/setup_wizard_storage_test.go internal/server/setup_wizard_review.go internal/server/setup_wizard_review_test.go)"
          if [[ -n "${unformatted}" ]]; then
            printf 'A4.4 files require gofmt:\n%s\n' "${unformatted}" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build static binary
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/justvoxel-webui ./cmd/justvoxel-webui
      - name: Smoke version output
        run: /tmp/justvoxel-webui -version
