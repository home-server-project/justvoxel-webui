name: WebUI CI

on:
  pull_request:
  push:
    branches: [main, testing]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version: '1.25.x'
          check-latest: true
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build static binary
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/justvoxel-webui ./cmd/justvoxel-webui
      - name: Smoke version output
        run: /tmp/justvoxel-webui -version
