name: Release WebUI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version: '1.25.x'
          check-latest: true
      - name: Validate semantic version and branch channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: ${tag}" >&2
            exit 1
          fi
          version="${tag#v}"
          git fetch --no-tags origin main testing
          if [[ "${tag}" == *-* ]]; then
            prerelease=true
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/testing || {
              echo 'Prerelease tags must point to a commit reachable from testing.' >&2
              exit 1
            }
          else
            prerelease=false
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
              echo 'Stable tags must point to a commit reachable from main.' >&2
              exit 1
            }
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
      - name: Test
        run: go test ./...
      - name: Build release artifact
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          commit="${GITHUB_SHA}"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist/package
          go build -trimpath \
            -ldflags "-s -w -X github.com/home-server-project/justvoxel-webui/internal/version.Version=${VERSION} -X github.com/home-server-project/justvoxel-webui/internal/version.Commit=${commit} -X github.com/home-server-project/justvoxel-webui/internal/version.ManagementAPI=v1 -X github.com/home-server-project/justvoxel-webui/internal/version.BuildDate=${built}" \
            -o dist/package/justvoxel-webui ./cmd/justvoxel-webui
          printf '{"version":"%s","source_commit":"%s","management_api":"v1","build_date":"%s","go_version":"%s"}\n' \
            "${VERSION}" "${commit}" "${built}" "$(go version | awk '{print $3}')" > dist/package/release.json
          tar -C dist/package -czf "dist/justvoxel-webui-v${VERSION}-linux-amd64.tar.gz" justvoxel-webui release.json
          (cd dist && sha256sum "justvoxel-webui-v${VERSION}-linux-amd64.tar.gz" > SHA256SUMS)
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      - name: Sign and verify checksum
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COSIGN_PRIVATE_KEY:-}"
          cosign sign-blob -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            --output-signature dist/SHA256SUMS.sig \
            dist/SHA256SUMS
          cosign verify-blob \
            --new-bundle-format=false \
            --key cosign.pub \
            --signature dist/SHA256SUMS.sig \
            dist/SHA256SUMS >/dev/null
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--title "JustVoxel WebUI v${VERSION}" --generate-notes)
          if [[ "${PRERELEASE}" == "true" ]]; then args+=(--prerelease); fi
          gh release create "v${VERSION}" dist/justvoxel-webui-v${VERSION}-linux-amd64.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig "${args[@]}"
